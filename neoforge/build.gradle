plugins {
    id 'com.github.johnrengelman.shadow'
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }

    maven { url = "https://maven.createmod.net" } // Create, Ponder, Flywheel
    maven { url = "https://maven.ithundxr.dev/snapshots" } // Registrate
}

loom {
    accessWidenerPath = project(":common").loom.accessWidenerPath
}

dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')

    modCompileOnly "mezz.jei:jei-${rootProject.minecraft_version}-neoforge-api:${rootProject.jei_version}"

    modRuntimeOnly "maven.modrinth:moonlight:${rootProject.moonlight_version}-neoforge"

    implementation("com.simibubi.create:create-${rootProject.minecraft_version}:${project.create_version}:slim") { transitive = false }
    implementation("net.createmod.ponder:Ponder-NeoForge-${rootProject.minecraft_version}:${project.ponder_version}")
    compileOnly("dev.engine-room.flywheel:flywheel-neoforge-api-${rootProject.minecraft_version}:${project.flywheel_version}")
    runtimeOnly("dev.engine-room.flywheel:flywheel-neoforge-${rootProject.minecraft_version}:${project.flywheel_version}")
    implementation("com.tterrag.registrate:Registrate:${project.registrate_version}")
}

processResources {
    var replaceProperties = [
            minecraft_version      : rootProject.minecraft_version,
            neo_version            : rootProject.neoforge_version,
            neo_version_range      : rootProject.neoforge_version_range,
            loader_version_range   : rootProject.neoforge_loader_version_range,
            moonlight_version      : rootProject.moonlight_version,
            mod_id                 : rootProject.mod_id,
            mod_version            : rootProject.mod_version,
            mod_name               : rootProject.archives_name,
            mod_description        : rootProject.mod_description,
            mod_authors            : rootProject.mod_authors,
            mod_license            : rootProject.mod_license,
            mod_site               : rootProject.mod_site,
            mod_issues             : rootProject.mod_issues
    ]
    inputs.properties replaceProperties

    filesMatching(["META-INF/neoforge.mods.toml"]) {
        expand replaceProperties
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    atAccessWideners.add("condiments.accesswidener")
    inputFile.set(shadowJar.archiveFile)
}
